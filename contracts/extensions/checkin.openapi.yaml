openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AstrLink Aggregated Check-in Extension
  version: 0.1.0
  summary: Private local contract for the relay check-in extension.
  description: |
    This document is an extension contract, not part of the stable local
    control API in `control-api.openapi.yaml`. It is versioned on its own and
    carries no compatibility promise to that contract: a Core build without
    this extension answers every path below with 404, and the desktop must
    present the feature as unavailable rather than failing.

    Every operation is `operator`. There is no observer-readable path, because
    a check-in account identifies a paid relay account and its state is not
    needed by agent tools.

    The extension is off by default. While it is off, `GET /status` and the
    settings operations still answer, so the operator has somewhere to turn it
    on; every other path answers 409 `checkin_disabled`. A disabled extension
    creates no tables, starts no timer and makes no request to any site.

    Reads are cache-only. A GET never contacts a relay site, never creates
    storage and never consumes a daily check-in, so polling this API cannot
    change what the site believes.

    Writes are idempotent by `request_id`. The desktop's control transport
    retries some writes on its own, so the same `request_id` with the same
    content must replay the stored receipt instead of submitting twice;
    the same `request_id` with different content is 409 `request_id_reused`.
    This bounds duplicate work inside AstrLink. It is not distributed
    exactly-once: a submission that was dispatched and then lost its response
    is reported as `uncertain` and resolved by re-reading status, never by
    submitting again.

    No response in this document carries a site session, a cookie, a token, a
    proxy password or a relay's own error text.
servers:
  - url: http://127.0.0.1:0
    description: Core's ephemeral local control address.
tags:
  - name: status
    description: Extension availability and settings.
  - name: accounts
    description: Check-in accounts and their service bindings.
  - name: authorization
    description: Short-lived sessions that store a verified site session.
  - name: jobs
    description: Check-in and status-refresh jobs.
paths:
  /control/v1/extensions/checkin/status:
    get:
      operationId: getCheckinStatus
      x-astrlink-side-effects: none
      x-astrlink-available-when-disabled: true
      summary: Read extension availability.
      description: |
        Answers whether the extension is present and enabled. Available while
        disabled, and never creates storage or contacts a site.
      tags: [status]
      x-astrlink-role: operator
      responses:
        "200":
          description: Extension status.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/extensions/checkin/settings:
    get:
      operationId: getCheckinSettings
      x-astrlink-side-effects: none
      x-astrlink-available-when-disabled: true
      summary: Read extension settings.
      tags: [status]
      x-astrlink-role: operator
      responses:
        "200":
          description: Current settings.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateCheckinSettings
      x-astrlink-available-when-disabled: true
      summary: Enable or disable the extension.
      description: |
        Turning the extension on prepares its own storage and scheduler.
        Repeating the request with the same `request_id` replays the stored
        receipt rather than rebuilding them.
      tags: [status]
      x-astrlink-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings after the change.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RequestIDReused"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /control/v1/extensions/checkin/accounts:
    get:
      operationId: listCheckinAccounts
      x-astrlink-side-effects: none
      summary: List check-in accounts from local state.
      tags: [accounts]
      x-astrlink-role: operator
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of accounts.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ExtensionDisabled"
    post:
      operationId: createCheckinAccount
      summary: Create a draft account.
      description: |
        A new account is always a draft: it has no verified remote user and no
        stored session until an authorization session completes.
      tags: [accounts]
      x-astrlink-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDraft"
      responses:
        "201":
          description: The created draft.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The `request_id` was reused with different content, the extension
            is disabled, or the site and remote user already exist.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /control/v1/extensions/checkin/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: getCheckinAccount
      x-astrlink-side-effects: none
      summary: Read one account from local state.
      tags: [accounts]
      x-astrlink-role: operator
      responses:
        "200":
          description: The account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ExtensionDisabled"
    patch:
      operationId: updateCheckinAccount
      summary: Change an account's address, egress, zone, bindings or automation.
      description: |
        `expected_revision` must equal the account's current revision.
        Changing the address, the egress or the remote user invalidates any
        stored authorization for the account instead of redirecting it.

        Bindings name services this extension only reads. A binding never
        edits, enables, disables or re-credentials the service it names.
      tags: [accounts]
      x-astrlink-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RequestIDReused"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteCheckinAccount
      summary: Delete an account and its stored session.
      description: |
        Removes the account, its bindings and its sealed session. The services
        it was bound to are left untouched. Deleting an account that is
        already gone succeeds, so a retried delete is not an error.
      tags: [accounts]
      x-astrlink-role: operator
      parameters:
        - $ref: "#/components/parameters/RequestIDQuery"
        - $ref: "#/components/parameters/ExpectedRevisionQuery"
      responses:
        "204":
          description: The account no longer exists.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RequestIDReused"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /control/v1/extensions/checkin/authorizations:
    post:
      operationId: beginCheckinAuthorization
      summary: Begin a short-lived authorization session.
      description: |
        Returns a session the host uses to store a session captured in an
        isolated login window. The session is bound to the account's revision
        and configuration fingerprint and expires on its own.

        This operation opens no window and captures nothing by itself.
      tags: [authorization]
      x-astrlink-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRequest"
      responses:
        "201":
          description: The authorization session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RequestIDReused"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /control/v1/extensions/checkin/authorizations/{sessionId}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: completeCheckinAuthorization
      summary: Store a captured session after verifying it against the site.
      description: |
        The request body carries the captured session. Core asks the site
        whose session it is and stores it only if the site answers; a remote
        user supplied by a page or a window is never trusted, and a different
        user than the account expects is 409 `identity_mismatch` with nothing
        written. Only the account's stored dashboard origin and network are
        contacted.

        The same `request_id` replays the stored receipt, also after a Core
        restart. An unfinished session does not survive a restart.

        The response is a receipt. It never echoes the session back.
      tags: [authorization]
      x-astrlink-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationCompletion"
      responses:
        "200":
          description: The account after the session was stored.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such session, or it has expired.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            The `request_id` was reused with different content
            (`request_id_reused`), the session was already completed
            (`authorization_completed`), the site reported another user
            (`identity_mismatch`), or the site did not accept the session
            (`auth_required`, `manual_required`, `unsupported`). Retryable
            `account_busy` means a check-in is running on the account.
            Nothing is written in any of these cases.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: |
            Retryable: the site could not be asked (`site_unavailable`,
            `rate_limited`) or the extension is stopping. Nothing was stored;
            repeat the same request.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /control/v1/extensions/checkin/jobs:
    get:
      operationId: listCheckinJobs
      x-astrlink-side-effects: none
      summary: List job receipts from local state.
      tags: [jobs]
      x-astrlink-role: operator
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: account_id
          in: query
          required: false
          description: Only jobs for this account.
          schema:
            $ref: "#/components/schemas/AccountId"
      responses:
        "200":
          description: One page of receipts.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ExtensionDisabled"
    post:
      operationId: createCheckinJob
      summary: Queue a check-in or a read-only status refresh.
      description: |
        Returns 202 with the queued receipt; the work runs in the background.
        The control request never waits for a site or for a person.

        `accounts` may name more than one account. A batch returns a parent
        receipt whose children are independent: one child failing does not
        fail the others.

        Repeating the request with the same `request_id` and the same content
        returns the same job rather than queueing a second one, which is what
        makes a retried or lost response safe.
      tags: [jobs]
      x-astrlink-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: The queued job.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The `request_id` was reused with different content, or the
            extension is disabled.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /control/v1/extensions/checkin/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getCheckinJob
      x-astrlink-side-effects: none
      summary: Read one job receipt from local state.
      tags: [jobs]
      x-astrlink-role: operator
      responses:
        "200":
          description: The receipt.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ExtensionDisabled"
  /control/v1/extensions/checkin/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: cancelCheckinJob
      summary: Stop a job that has not finished.
      description: |
        Cancels a queued or running job. Cancelling keeps whatever was already
        dispatched: if the submission had left the machine, the receipt stays
        `uncertain` and is resolved by re-reading status. Cancellation never
        claims that a submission was undone at the site.

        Cancelling a finished job is 409 `job_not_cancellable`.
      tags: [jobs]
      x-astrlink-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: The receipt after cancellation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The job already finished, or the `request_id` was reused with
            different content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  headers:
    NoStore:
      description: Always `no-store`; these responses describe live local state.
      required: true
      schema:
        type: string
        const: no-store
  parameters:
    AccountID:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountId"
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/JobId"
    SessionID:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SessionId"
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. A value above the maximum is rejected rather than clamped,
        so a caller is never silently given a different page than it asked
        for.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a previous page.
      schema:
        type: string
        maxLength: 256
    RequestIDQuery:
      name: request_id
      in: query
      required: true
      description: Idempotency key, fixed across retries of one logical action.
      schema:
        $ref: "#/components/schemas/RequestId"
    ExpectedRevisionQuery:
      name: expected_revision
      in: query
      required: true
      description: The revision the caller believes the account has.
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: No valid control token was presented.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller is not an operator.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No such account, job or session.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: The request body or query was rejected.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestIDReused:
      description: |
        The same `request_id` arrived with different content. The stored
        receipt is left as it is.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RevisionConflict:
      description: |
        `expected_revision` does not match the account, so the prepared change
        no longer applies.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExtensionDisabled:
      description: |
        The extension is off. Status and settings still answer so it can be
        turned on.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeded the extension's limit.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: |
        The extension's own storage or scheduler failed. Core's other
        functions are unaffected.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AccountId:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[a-z][a-z0-9_]*$"
      description: The extension's own account identifier; never a service id.
    JobId:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[a-z0-9_]+$"
    SessionId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
      description: |
        Fixed for one logical action across every retry, including the
        desktop transport's own automatic retries.
    ServiceId:
      type: string
      minLength: 3
      maxLength: 96
      pattern: "^[a-z][a-z0-9_-]*$"
    DashboardUrl:
      type: string
      format: uri
      maxLength: 2048
      description: |
        Absolute http(s) relay address with no userinfo, query or fragment. A
        sub-path is preserved. Plaintext http is accepted only for an
        explicit loopback host.
    TimeZone:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Explicit IANA zone such as `Asia/Shanghai`. `Local` is refused so a
        scheduled check-in cannot change its day when the host changes zone.
    Network:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [direct, system, custom]
        proxy_url:
          type: string
          maxLength: 2048
          description: |
            Required for `custom` and forbidden otherwise. Carries no
            userinfo; proxy authentication is sealed with the session.
      additionalProperties: false
    AccountState:
      type: string
      enum: [draft, connected, auth_required, manual_required]
      description: |
        Lifecycle, not the result of a check-in. `draft` has no verified
        remote user; every other state does.
    Account:
      type: object
      required:
        [
          id,
          dashboard_base_url,
          state,
          revision,
          network,
          time_zone,
          automatic,
          bound_services,
          config_fingerprint,
        ]
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        dashboard_base_url:
          $ref: "#/components/schemas/DashboardUrl"
        state:
          $ref: "#/components/schemas/AccountState"
        revision:
          type: integer
          minimum: 1
        network:
          $ref: "#/components/schemas/Network"
        time_zone:
          $ref: "#/components/schemas/TimeZone"
        automatic:
          type: boolean
          description: |
            Off until the operator turns it on. Only a connected account may
            have it on.
        remote_user_id:
          type: string
          maxLength: 128
          description: |
            What the site reported for the stored session. Absent for a
            draft. Never supplied by the caller.
        bound_services:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ServiceId"
        config_fingerprint:
          type: string
          minLength: 64
          maxLength: 64
          description: |
            Covers everything that decides where a session is sent. A stored
            authorization is reused only while it is unchanged.
      additionalProperties: false
    AccountDraft:
      type: object
      required: [request_id, dashboard_base_url, time_zone]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        dashboard_base_url:
          $ref: "#/components/schemas/DashboardUrl"
        time_zone:
          $ref: "#/components/schemas/TimeZone"
        network:
          $ref: "#/components/schemas/Network"
      additionalProperties: false
    AccountUpdate:
      type: object
      required: [request_id, expected_revision]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        expected_revision:
          type: integer
          minimum: 1
        dashboard_base_url:
          $ref: "#/components/schemas/DashboardUrl"
        time_zone:
          $ref: "#/components/schemas/TimeZone"
        network:
          $ref: "#/components/schemas/Network"
        automatic:
          type: boolean
        bound_services:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ServiceId"
      additionalProperties: false
    AccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Account"
        next_cursor:
          type: string
          maxLength: 256
      additionalProperties: false
    Settings:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
      additionalProperties: false
    SettingsUpdate:
      type: object
      required: [request_id, enabled]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        enabled:
          type: boolean
      additionalProperties: false
    ExtensionStatus:
      type: object
      required:
        [protocol_version, present, enabled, storage_ready, scheduler_running]
      properties:
        protocol_version:
          type: integer
          const: 1
          description: |
            The extension wire version this Core serves. A desktop that
            expects another value treats the feature as unsupported instead
            of sending requests shaped for a different contract.
        present:
          type: boolean
          const: true
          description: |
            Always true when this path answers. A Core without the extension
            returns 404 instead, which is how the desktop tells "off" from
            "not built".
        enabled:
          type: boolean
        storage_ready:
          type: boolean
          description: False while disabled; the extension creates no tables then.
        scheduler_running:
          type: boolean
          description: False while disabled; no timer and no site request then.
        last_error_code:
          type: string
          maxLength: 96
          pattern: "^[a-z][a-z0-9_]*$"
          description: |
            Why enabling failed, so the operator can retry. Carries no site
            text.
      additionalProperties: false
    AuthorizationRequest:
      type: object
      required: [request_id, account_id, expected_revision]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        account_id:
          $ref: "#/components/schemas/AccountId"
        expected_revision:
          type: integer
          minimum: 1
      additionalProperties: false
    Authorization:
      type: object
      required:
        [session_id, account_id, expires_at, config_fingerprint, login_url]
      properties:
        session_id:
          $ref: "#/components/schemas/SessionId"
        account_id:
          $ref: "#/components/schemas/AccountId"
        expires_at:
          type: string
          format: date-time
        config_fingerprint:
          type: string
          minLength: 64
          maxLength: 64
        login_url:
          $ref: "#/components/schemas/DashboardUrl"
      additionalProperties: false
    AuthorizationCompletion:
      type: object
      required: [request_id, credential]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        credential:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 87400
          description: |
            The captured session, base64, bounded to 64 KiB decoded. Write
            only: no response in this document returns it, and it is sealed
            before it is stored.
        expected_revision:
          type: integer
          minimum: 1
        claimed_user_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The user the login window believes it signed in as. It is not
            trusted: Core only uses it to ask the account's own site to
            confirm the session, stores the user the site reports, and refuses
            a value that differs from an account's existing user. Some site
            dialects cannot be asked without it.
      additionalProperties: false
    JobAction:
      type: string
      enum: [check_in, status_refresh]
      description: |
        `status_refresh` is read-only and can never dispatch a submission; it
        is what resolves an `uncertain` receipt.
    JobStatus:
      type: string
      enum:
        [
          queued,
          running,
          success,
          already_checked,
          not_checked,
          auth_required,
          manual_required,
          unsupported,
          rate_limited,
          retryable_failure,
          uncertain,
          cancelled,
        ]
      description: |
        `success` and `already_checked` both mean the day is done.
        `not_checked` means a read-only refresh succeeded and the site reported
        no check-in today; it does not consume the day's check-in.
        `uncertain` means a submission may have been dispatched and its result could not
        be established; it is resolved by re-reading status, never by
        submitting again.
    ProofSource:
      type: string
      enum: [submission_response, status_read, none]
      description: |
        Where a finished result came from. A result is never inferred from an
        HTTP status alone or from a balance change.
    Reward:
      type: object
      required: [known]
      properties:
        known:
          type: boolean
        quota:
          type: integer
          minimum: 0
          description: Present only when `known` is true.
        unit:
          type: string
          maxLength: 32
          description: Present only when `known` is true.
      additionalProperties: false
    JobRequest:
      type: object
      required: [request_id, action, accounts]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        action:
          $ref: "#/components/schemas/JobAction"
        accounts:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccountId"
        expected_revision:
          type: integer
          minimum: 1
          description: |
            Allowed only when `accounts` names exactly one account; a batch
            cannot pin one revision across several accounts.
      additionalProperties: false
      description: |
        The body names accounts and an action. There is no URL, method, header
        or body passthrough: a caller cannot use this API to make the host
        send an arbitrary request.
    Job:
      type: object
      required:
        [id, action, status, dispatched, proof_source, created_at, children]
      properties:
        id:
          $ref: "#/components/schemas/JobId"
        account_id:
          $ref: "#/components/schemas/AccountId"
          description: Absent on a batch parent.
        action:
          $ref: "#/components/schemas/JobAction"
        status:
          $ref: "#/components/schemas/JobStatus"
        dispatched:
          type: boolean
          description: |
            Whether a submission left the machine. Recorded separately from
            the result so a dropped connection is never retried as if
            nothing had been sent.
        proof_source:
          $ref: "#/components/schemas/ProofSource"
        site_date:
          type: string
          maxLength: 32
          description: The date the site attributed the result to, when it reported one.
        reward:
          $ref: "#/components/schemas/Reward"
        failure_code:
          type: string
          maxLength: 96
          pattern: "^[a-z][a-z0-9_]*$"
          description: |
            AstrLink's own classification. The relay's error text is never
            forwarded.
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        children:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/Job"
          description: |
            Children of a batch parent, each independent. Empty for a single
            job.
      additionalProperties: false
    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: string
          maxLength: 256
      additionalProperties: false
    CancelRequest:
      type: object
      required: [request_id]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/ControlError"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
      description: |
        The same envelope the local control API uses, so the desktop's
        existing error handling applies unchanged.
    ControlError:
      type: object
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 96
          pattern: "^[a-z][a-z0-9_]*$"
          examples:
            [
              checkin_disabled,
              request_id_reused,
              revision_conflict,
              identity_mismatch,
              job_not_cancellable,
              credentials_unavailable,
            ]
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            AstrLink's own sanitized wording. It never contains a relay's
            response body or a captured session.
        retryable:
          type: boolean
        details:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ErrorDetail"
      additionalProperties: false
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          maxLength: 128
        reason:
          type: string
          maxLength: 256
        account_id:
          $ref: "#/components/schemas/AccountId"
        retry_after_seconds:
          type: integer
          minimum: 0
      additionalProperties: false
