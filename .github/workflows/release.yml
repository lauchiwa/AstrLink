name: Release

on:
  push:
    tags: ["**"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  ASTRLINK_RELEASE_REPOSITORY: ${{ github.repository }}
  MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Waiting for the tagged commit's CI run can take about twenty minutes.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Validate tag and signing configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun apps/desktop/scripts/release-updates.mjs version "$RELEASE_TAG"
          bun apps/desktop/scripts/release-updates.mjs preflight
      # Tests run once, in CI, when the commit is pushed to a branch. A release
      # only repeats the build, signing, and installer smoke checks.
      # Fork deviation: a workflow_dispatch retry runs with github.sha set to
      # the dispatch ref, not the tag being rebuilt. Check the commit the
      # checkout above resolved from refs/tags/<tag> instead.
      - name: Require a passing CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: SHA="$(git rev-parse HEAD)" scripts/require-ci-success.sh

  # Intel macOS builds in release-macos-x86_64.yml, which adds its package to
  # this release after publish.
  macos:
    needs: validate
    uses: ./.github/workflows/macos-package.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      arch: arm64
    secrets: inherit

  windows:
    needs: validate
    uses: ./.github/workflows/windows-package.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets: inherit

  linux:
    needs: validate
    uses: ./.github/workflows/linux-package.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets: inherit

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AstrLink-*
          path: artifacts
      - name: Verify all platforms and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: bun apps/desktop/scripts/release-updates.mjs publish artifacts release "$RELEASE_TAG"
